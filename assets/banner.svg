<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-label="Kaneez e Zahra, Applied AI Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040b2b"/>
      <stop offset="0.45" stop-color="#0f2a6e"/>
      <stop offset="0.8" stop-color="#2a5aa8"/>
      <stop offset="1" stop-color="#3c74c0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f6c744" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f6c744" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>

    <!-- brush texture: wobbles every stroke a little so it reads as paint, not vector -->
    <filter id="brush" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
    </filter>

    <mask id="crescent">
      <rect width="1200" height="400" fill="#fff"/>
      <circle cx="1112" cy="76" r="34" fill="#000"/>
    </mask>

    <!-- one wind band, reused with offsets -->
    <path id="band" d="M-40 175 C 120 105, 250 235, 410 170 S 690 80, 820 150 S 1040 230, 1240 140"/>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- swirling sky -->
  <g filter="url(#brush)" fill="none" stroke-linecap="round">
    <g stroke="#6f9be0" stroke-width="11" opacity="0.35" stroke-dasharray="90 40">
      <use href="#band" transform="translate(0,-60)"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-260" dur="26s" repeatCount="indefinite"/>
    </g>
    <g stroke="#a9c4f2" stroke-width="7" opacity="0.4" stroke-dasharray="60 50">
      <use href="#band" transform="translate(0,-28)"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="21s" repeatCount="indefinite"/>
    </g>
    <g stroke="#2d58b3" stroke-width="16" opacity="0.55" stroke-dasharray="120 30">
      <use href="#band"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-300" dur="32s" repeatCount="indefinite"/>
    </g>
    <g stroke="#cfe0ff" stroke-width="5" opacity="0.45" stroke-dasharray="40 60">
      <use href="#band" transform="translate(0,26)"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="17s" repeatCount="indefinite"/>
    </g>

    <!-- the big spiral, right of centre -->
    <g stroke-dasharray="130 24">
      <path d="M720 108 C 800 40, 930 70, 940 150 C 950 235, 840 262, 788 212 C 740 166, 790 108, 846 128 C 890 144, 884 192, 846 198"
            stroke="#4f7fd0" stroke-width="15" opacity="0.7"/>
      <path d="M740 118 C 805 62, 912 86, 922 152 C 930 220, 846 242, 806 204 C 770 170, 806 128, 846 144"
            stroke="#c4d8fa" stroke-width="6" opacity="0.55"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-308" dur="24s" repeatCount="indefinite"/>
    </g>

    <!-- second, smaller curl on the left -->
    <g stroke-dasharray="70 20">
      <path d="M330 70 C 380 20, 470 40, 474 96 C 478 150, 410 164, 380 128 C 354 98, 384 68, 416 84"
            stroke="#6f9be0" stroke-width="9" opacity="0.5"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="18s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- moon -->
  <circle cx="1100" cy="82" r="90" fill="url(#moonGlow)"/>
  <circle cx="1100" cy="82" r="62" fill="none" stroke="#f6c744" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="1100" cy="82" r="78" fill="none" stroke="#f6c744" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="1100" cy="82" r="38" fill="#f9d567" mask="url(#crescent)"/>

  <!-- stars: halo, ring, core. each one breathes on its own clock -->
  <g>
    <g transform="translate(250,58)">
      <circle r="30" fill="url(#halo)"><animate attributeName="opacity" values="0.55;1;0.55" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle r="13" fill="none" stroke="#ffe9a0" stroke-opacity="0.5"/>
      <circle r="5" fill="#fff3c4"/>
    </g>
    <g transform="translate(560,40)">
      <circle r="26" fill="url(#halo)"><animate attributeName="opacity" values="1;0.5;1" dur="5.1s" repeatCount="indefinite"/></circle>
      <circle r="11" fill="none" stroke="#ffe9a0" stroke-opacity="0.5"/>
      <circle r="4.5" fill="#fff3c4"/>
    </g>
    <g transform="translate(985,200)">
      <circle r="28" fill="url(#halo)"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle r="12" fill="none" stroke="#ffe9a0" stroke-opacity="0.5"/>
      <circle r="5" fill="#fff3c4"/>
    </g>
    <g transform="translate(640,112)">
      <circle r="22" fill="url(#halo)"><animate attributeName="opacity" values="1;0.45;1" dur="6s" repeatCount="indefinite"/></circle>
      <circle r="9" fill="none" stroke="#ffe9a0" stroke-opacity="0.5"/>
      <circle r="3.8" fill="#fff3c4"/>
    </g>
    <g transform="translate(40,130)">
      <circle r="24" fill="url(#halo)"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle r="4" fill="#fff3c4"/>
    </g>
    <g transform="translate(1170,230)">
      <circle r="20" fill="url(#halo)"><animate attributeName="opacity" values="1;0.5;1" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle r="3.6" fill="#fff3c4"/>
    </g>
  </g>

  <!-- distant hills -->
  <path d="M0 322 C 160 290, 300 318, 470 300 S 800 280, 960 304 S 1140 296, 1200 288 L1200 400 L0 400 Z" fill="#162a5c"/>
  <path d="M0 348 C 200 322, 380 350, 600 336 S 960 322, 1200 342 L1200 400 L0 400 Z" fill="#0c1a3d"/>

  <!-- village -->
  <g fill="#09132c">
    <rect x="560" y="318" width="34" height="32"/><polygon points="556,318 577,300 598,318"/>
    <rect x="610" y="326" width="28" height="26"/><polygon points="607,326 624,312 641,326"/>
    <rect x="660" y="322" width="40" height="30"/>
    <rect x="712" y="328" width="26" height="24"/><polygon points="709,328 725,316 741,328"/>
    <rect x="500" y="330" width="30" height="22"/>
    <!-- church spire -->
    <rect x="770" y="306" width="22" height="46"/><polygon points="766,306 781,262 796,306"/>
  </g>
  <g fill="#ffd45e">
    <rect x="570" y="328" width="6" height="8"><animate attributeName="opacity" values="1;0.55;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="620" y="334" width="5" height="7"/>
    <rect x="672" y="331" width="6" height="8"><animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="720" y="336" width="5" height="7"/>
    <rect x="508" y="338" width="5" height="6"/>
    <rect x="777" y="322" width="5" height="8"/>
  </g>

  <!-- cypress -->
  <g filter="url(#brush)">
    <path d="M172 400 C 120 338, 130 276, 148 222 C 166 166, 138 112, 172 28 C 206 112, 198 168, 190 224 C 180 282, 226 340, 206 400 Z" fill="#0a1a14"/>
    <path d="M172 380 C 150 330, 156 270, 168 220 C 178 170, 166 110, 172 70" fill="none" stroke="#1d3d2c" stroke-width="3" opacity="0.8"/>
    <path d="M186 372 C 176 320, 190 270, 184 214" fill="none" stroke="#1d3d2c" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- type -->
  <text x="270" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-style="italic" fill="#fbeaa8">Kaneez e Zahra</text>
  <text x="272" y="272" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="19" fill="#c7d9f7">applied ai engineer, data science, GIKI 2026</text>
  <text x="272" y="300" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#8fb0e6">
    <tspan>$ python night.py</tspan>
    <tspan fill="#f6c744"> _</tspan>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
